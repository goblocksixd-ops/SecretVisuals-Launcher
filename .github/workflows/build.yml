
name: Build SecretVisuals Launcher

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Windows EXE
        run: npm run dist

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: SecretVisuals-Windows
          path: dist/*.exe
          if-no-files-found: error

